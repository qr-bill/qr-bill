# Weekly updates of the GitHub Actions and of the npm development dependencies. The 7-day cooldown matches
# `minimumReleaseAge` in pnpm-workspace.yaml: a version is only proposed once it has been public for a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    assignees: [acrifolium]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.0.x until typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      # The Node types match the oldest supported Node (engines: >=22.12); raise them together with engines.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
    assignees: [acrifolium]
